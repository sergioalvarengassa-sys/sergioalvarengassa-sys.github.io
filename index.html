<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f8f6f2">
<title>Contas CCS</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
<script type="module" src="app.js"></script>
</head>
<body class="app-shell">
<aside class="sidebar" aria-label="Navegação principal">
  <div class="sidebar-inner">
    <button class="brand" type="button" data-action="tab:monthly"><img src="icon.svg" alt="">Contas CCS</button>
    <nav id="tabs" aria-label="Relatórios"></nav>
    <button id="settings" type="button" class="outline">Dados e sincronização</button>
  </div>
</aside>
<main>
  <div class="toolbar">
    <div class="month-controls">
      <button id="prev" type="button" aria-label="Mês anterior">‹</button>
      <input type="month" id="month" aria-label="Mês do relatório" min="1900-01" max="9998-12">
      <button id="next" type="button" aria-label="Próximo mês">›</button>
    </div>
    <div class="toolbar-status">
      <span id="sync-state" class="sync-state" role="status">Abrindo base local…</span>
      <button id="mobile-conflicts" type="button" data-action="conflicts" hidden>Conflitos</button>
    </div>
  </div>
  <div id="alert" role="status" hidden></div>
  <section id="view" aria-label="Relatório"></section>
</main>
<footer class="app-footer"><a href="privacidade.html">Privacidade</a></footer>
<nav class="mobile-nav" aria-label="Navegação do celular">
  <button id="mobile-monthly" type="button" data-action="tab:monthly">Mensal</button>
  <button id="mobile-cards" type="button" data-action="cards">Cartões</button>
  <button id="mobile-settings" type="button" data-action="settings" aria-label="Dados e sincronização">Dados</button>
</nav>
<dialog id="dialog">
  <header><h2 id="dialog-title"></h2><button id="close-dialog" type="button" aria-label="Fechar">×</button></header>
  <div id="dialog-body"></div>
</dialog>
</body>
</html>
